<div id="history-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 17, 21, 0.7); backdrop-filter: blur(8px); z-index: 10005; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
    <div class="dialog-card" style="max-width: 480px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; background: rgba(30, 41, 59, 0.85); border: 1.6px solid rgba(255, 255, 255, 0.08); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); padding: 20px; box-sizing: border-box; backdrop-filter: blur(20px);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; margin-bottom: 16px; flex-shrink: 0;">
            <div style="display: flex; align-items: center; gap: 8px; color: var(--accent-nav);">
                <span class="material-icons-outlined">history</span>
                <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: #fff; letter-spacing: 0.5px;">프로젝트 재개정 이력</h3>
            </div>
            <button id="btn-close-history" class="btn-secondary" style="width: 28px; height: 28px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); cursor: pointer; color: var(--text-secondary); transition: all 0.2s;"><span class="material-icons-outlined" style="font-size: 16px;">close</span></button>
        </div>
        <div id="history-popup-list" style="flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 10px; min-height: 120px;">
            <!-- Dynamic history entries here -->
        </div>
    </div>
</div>
