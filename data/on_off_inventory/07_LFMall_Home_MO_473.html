<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, user-scalable=no">
    <title>LFMall Home (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../templates/lfmall/assets/lfmall_premium.css">
</head>
<body class="lfm-premium-body">
    <div class="page" style="background: #f8f9fa;">
        <!-- Mobile Frame Wrapper -->
        <div class="mobile-frame" style="position: absolute; top: 50px; left: 540px; background: #fff;">
            <div class="mobile-statusbar"><span>9:41</span><span>5G</span></div>
            <div class="mobile-header-notch"></div>
            
            <div class="mobile-content">
                <!-- Header -->
                <header class="lfm-header lf-component" id="lfm-mo-header" style="top: 52px; left: 0; width: 375px; height: 50px;">
                    <div class="lfm-container" style="display: flex; justify-content: space-between; align-items: center; height: 100%;">
                        <div class="lfm-logo"><img src="https://img.lfmall.co.kr/file/WAS/apps/2024/mfront/logo/lf_logo_mo.png" style="height: 20px;"></div>
                        <div style="display: flex; gap: 15px;">
                            <div class="lf-icon lf-icon-search" style="transform: scale(0.6);"></div>
                            <div class="lf-icon lf-icon-cart" style="transform: scale(0.6);"></div>
                        </div>
                    </div>
                </header>

                <!-- Navigation -->
                <nav class="lfm-nav lf-component" id="lfm-mo-nav" style="top: 102px; left: 0; width: 375px; height: 44px;">
                    <div class="lfm-container" style="display: flex; gap: 20px; overflow-x: auto; white-space: nowrap; height: 100%; align-items: center; border-bottom: 1px solid #eee;">
                        <span class="active v4-editable-cell" contenteditable="true" style="font-weight: 700; color: #002b5b;">홈</span>
                        <span class="v4-editable-cell" contenteditable="true">베스트</span>
                        <span class="v4-editable-cell" contenteditable="true">신상</span>
                        <span class="v4-editable-cell" contenteditable="true">특가</span>
                        <span class="v4-editable-cell" contenteditable="true">브랜드</span>
                    </div>
                </nav>

                <!-- Hero Banner -->
                <div class="lfm-hero lf-component" id="lfm-mo-hero" style="top: 146px; left: 0; width: 375px; height: 460px;">
                    <img src="https://img.lfmall.co.kr/file/WAS/display/lf2022/mobile/main_visual_dummy.jpg" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1441984904996-e0b6ba687e12?q=80&w=800&auto=format&fit=crop'">
                    <div style="position: absolute; bottom: 40px; left: 20px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                        <div class="v4-editable-cell" contenteditable="true" style="font-size: 28px; font-weight: 900; line-height: 1.2;">SEASON OFF<br>UP TO 50%</div>
                        <div class="v4-editable-cell" contenteditable="true" style="font-size: 14px; margin-top: 10px; opacity: 0.8;">지금 바로 확인하기 ></div>
                    </div>
                </div>

                <!-- Footer Nav -->
                <footer class="lfm-footer-nav lf-component" id="lfm-mo-footer" style="top: 746px; left: 0; width: 375px; height: 66px; background: #fff; border-top: 1px solid #eee;">
                    <div style="display: flex; justify-content: space-around; align-items: center; height: 100%;">
                        <div style="text-align: center;"><div class="lf-icon lf-icon-category" style="transform: scale(0.65);"></div><div style="font-size: 10px; margin-top:-4px;">카테고리</div></div>
                        <div style="text-align: center;"><div class="lf-icon lf-icon-home" style="transform: scale(0.65);"></div><div style="font-size: 10px; margin-top:-4px; color: #002b5b; font-weight: 700;">홈</div></div>
                        <div style="text-align: center;"><div class="lf-icon lf-icon-my" style="transform: scale(0.65);"></div><div style="font-size: 10px; margin-top:-4px;">마이</div></div>
                    </div>
                </footer>
            </div>
            <div class="mobile-home-indicator"></div>
        </div>
    </div>
</body>
</html>
