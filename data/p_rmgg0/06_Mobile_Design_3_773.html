    <style>
        :root { --v4-primary: #6366f1; --v4-accent: #00e5ff; --v4-bg: #1e293b; --v4-frame-bg: #ffffff; }
        body { margin: 0; padding: 0; background: var(--v4-bg); font-family: 'Inter', 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; }
        .page { width: 1440px; height: 900px; position: relative; display: flex; justify-content: center; align-items: center; gap: 40px; }
        .mobile-frame { width: 375px; height: 812px; background: var(--v4-frame-bg); border-radius: 40px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 8px #111; overflow: hidden; border: 4px solid #334155; z-index: 10; }
        .mobile-header-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 30px; background: #111; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 1000; }

        .mobile-statusbar { position: absolute; top: 10px; left: 24px; right: 24px; height: 20px; display: flex; align-items: center; justify-content: space-between; color: #111827; font-size: 12px; font-weight: 800; z-index: 1001; pointer-events: none; white-space: nowrap; }
        .mobile-home-indicator { position: absolute; bottom: 8px; left: 50%; width: 132px; height: 5px; border-radius: 999px; background: #111827; transform: translateX(-50%); z-index: 1001; pointer-events: none; }
        .mobile-ui-header, .mobile-ui-card, .mobile-ui-nav, .mobile-ui-list { width: 100%; height: 100%; box-sizing: border-box; color: #0f172a; font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .mobile-ui-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .mobile-ui-card { padding: 18px; border-radius: 22px; background: linear-gradient(135deg, #111827, #334155); color: #fff; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18); }
        .mobile-ui-list { padding: 16px; border-radius: 18px; background: #f8fafc; border: 1px solid #e5e7eb; }

window.V4UndoManager = (function() {
    const MAX_HISTORY = 10;
    let undoStack = [];
    function notifyParent(data) { if (window.parent) window.parent.postMessage(data, '*'); }
    function markDirty() { notifyParent({ type: 'LF_DIRTY' }); }
    function getCleanHTML() {
        const host = document.querySelector('.page') || document.querySelector('.artboard') || document.body;
        const clone = host.cloneNode(true);
        clone.querySelectorAll('.lf-resizer, .lf-drag-handle, .lf-delete-trigger').forEach(el => el.remove());
        clone.querySelectorAll('.lf-component').forEach(el => el.classList.remove('selected'));
        return clone.innerHTML;
    }
    const applyState = (state) => {
        const host = document.querySelector('.page') || document.querySelector('.artboard') || document.body;
        host.innerHTML = state.html;
        if (!window.state) window.state = {};
        window.state.connectors = JSON.parse(JSON.stringify(state.connectors || []));
        if (window.ConnectorEngine) window.ConnectorEngine.redrawAll();
        if (typeof window.initHandles === 'function') window.initHandles();
        markDirty();
    };
    return {
        saveState: function() {
            if (!window.state) window.state = {};
            const snapshot = {
                html: getCleanHTML(),
                connectors: JSON.parse(JSON.stringify(window.state.connectors || []))
            };
            if (undoStack.length > 0 && JSON.stringify(undoStack[undoStack.length - 1]) === JSON.stringify(snapshot)) return;
            undoStack.push(snapshot);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            notifyParent({ type: 'LF_UNDO_SAVE' });
        },
        undo: function() {
            if (undoStack.length <= 1) return;
            redoStack.push(undoStack.pop());
            const previousState = undoStack[undoStack.length - 1];
            applyState(previousState);
            notifyParent({ type: 'LF_UNDO_SAVE' });
        },
        redo: function() {
            if (redoStack.length === 0) return;
            const nextState = redoStack.pop();
            undoStack.push(nextState);
            applyState(nextState);
            notifyParent({ type: 'LF_UNDO_SAVE' });
        },
        init: function() {
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) this.redo();
                    else this.undo();
                }
            });
        }
    };
})();

            const comps = document.querySelectorAll('.lf-component.selected');
            if (comps.length > 0) {
                if (window.V4UndoManager) window.V4UndoManager.saveState();
                comps.forEach(c => {
                    c.style.left = (parseInt(c.style.left || 0) + (d.dx || 0)) + 'px';
                    c.style.top = (parseInt(c.style.top || 0) + (d.dy || 0)) + 'px';
                    updateHandles(c);
                });
                notifyParent({ type: 'LF_SELECTION_MOVE', dx: d.dx || 0, dy: d.dy || 0 });
                markDirty();
            }
        } else if (d.type === 'LF_SAVE_UNDO') {
            if (window.V4UndoManager) window.V4UndoManager.saveState();
        } else if (d.type === 'LF_ALIGN_COMPONENTS' && d.updates) {
            d.updates.forEach(u => { const c = document.getElementById(u.id); if (c) { c.style.left = u.x + 'px'; c.style.top = u.y + 'px'; updateHandles(c); } });
            markDirty();
        } else if (d.type === 'LF_REQUEST_SAVE_CONTENT') {
            const c = document.documentElement.cloneNode(true);
            c.querySelectorAll('.lf-resizer, .lf-drag-handle, .lf-delete-trigger').forEach(el => el.remove());
            c.querySelectorAll('.lf-component').forEach(el => el.classList.remove('selected'));
            notifyParent({ type: 'LF_SAVE_CONTENT_RESPONSE', html: "<!DOCTYPE html>\n" + c.outerHTML });
        } else if (d.type === 'LF_INSERT_COMPONENT') {
            const host = document.querySelector('.page') || document.querySelector('.artboard') || document.body;
            const isM = host.classList.contains('mobile-content');
            const vh = isM ? host.clientHeight : window.innerHeight, vw = isM ? host.clientWidth : window.innerWidth;
            const sY = isM ? host.scrollTop : window.scrollY, sX = isM ? host.scrollLeft : window.scrollX;
            const cW = (d.style && d.style.width && d.style.width !== '100%') ? parseInt(d.style.width) || 200 : (d.style && d.style.width === '100%' ? vw : 200);
            const cH = (d.style && d.style.height && d.style.height !== 'auto') ? parseInt(d.style.height) || 100 : 100;
            const cT = Math.max(isM ? 56 : 0, sY + (vh - cH) / 2), cL = Math.max(isM ? 16 : 0, sX + (vw - cW) / 2);
            if (window.V4UndoManager) window.V4UndoManager.saveState();
            const v = document.createElement('div'); v.id = d.id || ('v4-comp-' + Date.now()); v.className = 'lf-component' + (d.isGroup ? ' lf-group' : ''); v.style.position = 'absolute'; v.style.top = cT + 'px'; v.style.left = cL + 'px'; v.style.zIndex = '1000';
            if (d.style) Object.assign(v.style, d.style);
            v.innerHTML = '<div class="lf-drag-handle"><svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M10,13V11H14V13H10M10,9V7H14V9H10M10,17V15H14V17H10M6,13V11H8V13H6M6,9V7H8V9H6M6,17V15H8V17H6M16,13V11H18V13H16M16,9V7H18V9H16M16,17V15H18V17H16Z"/></svg></div>' + d.html + '<div class="lf-resizer"></div><div class="lf-delete-trigger">×</div>';
            host.appendChild(v); 
            
            // Auto-select the newly added component
            document.querySelectorAll('.lf-component').forEach(x => x.classList.remove('selected'));
            v.classList.add('selected');
            updateHandles(v);
            notifyParent({ type: "LF_COMP_SELECTED", ..._getCompStyles(v) });
            
            markDirty();
        } else if (d.type === 'LF_UPDATE_STYLE') {
            const s = document.querySelector('.lf-component.selected'); if (!s) return;
            if (window.V4UndoManager) window.V4UndoManager.saveState();
            const t = d.selector ? s.querySelector(d.selector) : s; if (!t) return;
            if (d.style) {
                Object.assign(t.style, d.style);
                const svg = t.querySelector('path, polygon, rect, circle');
                if (svg) {
                    if (d.style.backgroundColor || d.style.background) { svg.style.fill = d.style.backgroundColor || d.style.background; if (t.classList.contains('v4-shape-diamond') || t.classList.contains('v4-shape-triangle')) t.style.backgroundColor = 'transparent'; }
                    if (d.style.borderColor) { svg.style.stroke = d.style.borderColor; svg.style.strokeWidth = "1.6"; }
                }
            }
            if (d.subSelector && d.subStyle) t.querySelectorAll(d.subSelector).forEach(sub => Object.assign(sub.style, d.subStyle));
            markDirty();
        } else if (d.type === 'LF_DELETE_SELECTED') {
            const s = document.querySelector('.lf-component.selected'); if (s) { if (window.V4UndoManager) window.V4UndoManager.saveState(); s.remove(); markDirty(); notifyParent({ type: 'LF_DESELECT' }); }
        } else if (d.type === 'LF_DESELECT_ALL') {
            document.querySelectorAll('.lf-component').forEach(x => x.classList.remove('selected'));
        } else if (d.type === 'LF_REQUEST_SNAP_TARGETS') {
            const targets = [];
            document.querySelectorAll('.lf-component:not(.selected)').forEach(c => {
                const r = c.getBoundingClientRect(); const n = c.id.replace('v4-comp-', 'Comp ');
                targets.push({ x: r.left, label: n, part: 'Left', type: 'h' }, { x: r.left + r.width / 2, label: n, part: 'Center', type: 'h' }, { x: r.right, label: n, part: 'Right', type: 'h' }, { y: r.top, label: n, part: 'Top', type: 'v' }, { y: r.top + r.height / 2, label: n, part: 'Middle', type: 'v' }, { y: r.bottom, label: n, part: 'Bottom', type: 'v' });
            });
            document.querySelectorAll('.mobile-frame').forEach((f, idx) => {
                const content = f.querySelector('.mobile-content');
                if (content) {
                    const sr = content.getBoundingClientRect(); const sN = 'UI Area ' + (idx + 1); const b = 8;
                    targets.push({ x: sr.left + b, label: sN, part: 'Left', type: 'h' }, { x: sr.right - b, label: sN, part: 'Right', type: 'h' }, { y: sr.top + b, label: sN, part: 'Top', type: 'v' }, { y: sr.bottom - b, label: sN, part: 'Bottom', type: 'v' }, { x: sr.left + sr.width / 2, label: sN, part: 'Center', type: 'h' }, { y: sr.top + sr.height / 2, label: sN, part: 'Middle', type: 'v' });
                }
            });
            notifyParent({ type: 'LF_SNAP_TARGETS_RESPONSE', targets });
        } else if (d.type === 'LF_TABLE_ACTION') {
            const s = document.querySelector('.lf-component.selected'); if (!s) return;
            if (window.V4UndoManager) window.V4UndoManager.saveState();
            const table = s.querySelector('table'); if (!table) return;
            const foc = table.querySelector('.v4-editable-cell:focus') || table.querySelector('td, th');
            const row = foc ? foc.closest('tr') : null, cell = foc ? foc.closest('td, th') : null;
            const act = (d.action || "").toLowerCase();
            if (act === 'add-row' || act === 'add_row') {
                const nR = table.insertRow(row ? row.rowIndex + 1 : -1);
                for (let i = 0; i < table.rows[0].cells.length; i++) { const c = nR.insertCell(); c.className = 'v4-editable-cell'; c.contentEditable = 'true'; c.innerText = 'New'; c.style.borderBottom = '1.6px solid #cbd5e1'; c.style.padding = '16px'; }
            } else if (act === 'add-col' || act === 'add_col') {
                Array.from(table.rows).forEach((r, idx) => {
                    const c = r.insertCell(-1);
                    if (idx === 0) { const th = document.createElement('th'); th.className = 'v4-editable-cell'; th.contentEditable = 'true'; th.innerText = 'Header'; th.style.background = '#cbd5e1'; th.style.borderBottom = '1.6px solid #475569'; th.style.padding = '16px'; r.replaceChild(th, c); }
                    else { c.className = 'v4-editable-cell'; c.contentEditable = 'true'; c.innerText = 'Data'; c.style.borderBottom = '1.6px solid #cbd5e1'; c.style.padding = '16px'; }
                });
            } else if ((act === 'del-row' || act === 'del_row') && row && table.rows.length > 1) { row.remove(); }
            else if ((act === 'del-col' || act === 'del_col') && cell) { const idx = cell.cellIndex; Array.from(table.rows).forEach(r => { if (r.cells[idx]) r.cells[idx].remove(); }); }
            markDirty();
        }
    });

    const initHandles = () => {
        document.querySelectorAll('.lf-component').forEach(c => {
            if (!c.querySelector('.lf-drag-handle')) { const h = document.createElement('div'); h.className = 'lf-drag-handle'; h.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M10,13V11H14V13H10M10,9V7H14V9H10M10,17V15H14V17H10M6,13V11H8V13H6M6,9V7H8V9H6M6,17V15H8V17H6M16,13V11H18V13H16M16,9V7H18V9H16M16,17V15H18V17H16Z"/></svg>'; c.appendChild(h); }
            if (!c.querySelector('.lf-resizer')) { const r = document.createElement('div'); r.className = 'lf-resizer'; c.appendChild(r); }
            if (!c.querySelector('.lf-delete-trigger')) { const d = document.createElement('div'); d.className = 'lf-delete-trigger'; d.innerText = '×'; c.appendChild(d); }
        });
    };

    const enforceDesignSystem = () => {
        initHandles();
        document.querySelectorAll('.v4-shape').forEach(s => {
            if (s.classList.contains('v4-shape-diamond') || s.classList.contains('v4-shape-triangle')) { s.style.setProperty('border-width', '0px', 'important'); return; }
            if (s.style.borderWidth !== '1.6px') s.style.setProperty('border-width', '1.6px', 'important');
        });
        document.querySelectorAll('table.v4-premium-table').forEach(t => { if (t.style.borderWidth !== '1.6px') t.style.setProperty('border-width', '1.6px', 'important'); });
        document.querySelectorAll('polygon, path, rect, circle').forEach(svg => {
            if (svg.getAttribute('stroke-width') !== '1.6') svg.setAttribute('stroke-width', '1.6');
            svg.style.strokeWidth = '1.6'; svg.style.vectorEffect = 'non-scaling-stroke';
        });
    };

    enforceDesignSystem();
    const observer = new MutationObserver(enforceDesignSystem);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
    setTimeout(enforceDesignSystem, 500);
})();

</script>
