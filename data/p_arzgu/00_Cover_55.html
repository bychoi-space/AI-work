<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <title>00. LFmall 배송 서비스 강화 커버</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --v4-primary: #1e3a8a;
            --v4-accent: #e60012;
            --v4-bg: #ffffff;
            --v4-surface: #f8f9fa;
            --v4-border: #475569;
            --v4-text: #1e293b;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--v4-surface); overflow: hidden; }
        .page { width: 1440px; height: 900px; position: relative; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); overflow: hidden; }
        
        .lf-component { position: absolute !important; box-sizing: border-box !important; }
        .lf-component:hover { outline: 2px solid var(--v4-accent) !important; cursor: move !important; }
        .lf-component.selected { outline: 2px solid var(--v4-accent) !important; z-index: 10001 !important; }
        
        .cover-title { font-size: 46px; font-weight: 900; color: #ffffff; letter-spacing: -1.5px; line-height: 1.2; }
        .cover-subtitle { font-size: 20px; font-weight: 600; color: #818cf8; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* 1.6px Border Metal Table Style */
        .meta-table {
            border-collapse: collapse; border: 1.6px solid #475569 !important;
            font-size: 13px; color: #cbd5e1; background: rgba(30, 41, 59, 0.7); text-align: center;
        }
        .meta-table th, .meta-table td {
            padding: 10px 18px; border: 1.6px solid #475569 !important; font-weight: 500;
        }
        .meta-table th { background: rgba(15, 23, 42, 0.9); color: #818cf8; font-weight: 700; }
        
        .v4-editable-cell { outline: none; width: 100%; display: block; }
    </style>
<style id="v4-inlined-style">
.lf-component { position: absolute; cursor: pointer; transition: outline 0.2s; box-sizing: border-box; z-index: 100; }
.lf-component.selected { outline: 2px solid #6366f1; z-index: 10001 !important; }
.v4-editable-cell:focus { outline: 2px solid #6366f1; background: rgba(99, 102, 241, 0.05) !important; }
</style>
</head>
<body>
    <div class="page">
        <!-- 1. 대형 데코레이션 그라디언트 오브브 -->
        <div class="lf-component" style="top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; z-index: 1;"></div>
        <div class="lf-component" style="bottom: -200px; right: -200px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(230,0,18,0.08) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; z-index: 1;"></div>

        <!-- 2. 브랜드 로고 뱃지 -->
        <div id="v4-cover-brand" class="lf-component" style="top: 80px; left: 80px; z-index: 10;">
            <div style="background: rgba(255,255,255,0.08); border: 1.6px solid rgba(255,255,255,0.2) !important; border-radius: 30px; padding: 8px 24px; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 1px;">
                LFMALL LOGISTICS INITIATIVE
            </div>
        </div>

        <!-- 3. 메인 타이틀 박스 -->
        <div id="v4-cover-title-box" class="lf-component" style="top: 260px; left: 80px; z-index: 10; width: 900px;">
            <div class="cover-title">
                LFmall 배송 서비스 강화<br>
                <span style="color: #6366f1; font-weight: 900;">당일배송 및 새벽배송 도입 기획안</span>
            </div>
            <div class="cover-subtitle">
                Logistics Optimization &amp; Partnership Strategy
            </div>
        </div>

        <!-- 4. 버전 표시 뱃지 -->
        <div id="v4-cover-version" class="lf-component" style="top: 480px; left: 80px; z-index: 10;">
            <div style="background: #e60012; color: #ffffff; font-size: 14px; font-weight: 900; padding: 6px 18px; border-radius: 4px; box-shadow: 0 4px 15px rgba(230,0,18,0.3);">
                VERSION 0.3
            </div>
        </div>

        <!-- 5. 1.6px 격자선 작성자 / 검토자 명품 메타데이터 테이블 (1:1 복원) -->
        <div id="v4-cover-meta-table" class="lf-component" style="bottom: 80px; right: 80px; width: 480px; z-index: 10;">
            <table class="meta-table" style="width: 100%;">
                <tbody>
                    <tr>
                        <th style="width: 25%;">작성자</th>
                        <td style="width: 25%; font-weight: 700;" contenteditable="true">최범열 매니저</td>
                        <th style="width: 25%;">작성일</th>
                        <td style="width: 25%;" contenteditable="true">2024.08.05</td>
                    </tr>
                    <tr>
                        <th>검토자</th>
                        <td style="font-weight: 700;" contenteditable="true">김용희 팀장</td>
                        <th>검토일</th>
                        <td contenteditable="true">2024.08.05</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body></html>
