<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <title>Cover - LFmall 배송 서비스 강화</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --v4-primary: #1a1a1a;
            --v4-accent: #e60012;
            --v4-bg: #ffffff;
            --v4-surface: #f8f9fa;
            --v4-border: #e1e3e5;
            --v4-text: #1a1c1e;
            --v4-text-sub: #6d7175;
            --v4-text-main: #1a1c1e;
        }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Inter', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: var(--v4-surface); 
            overflow: hidden; color: var(--v4-text);
        }
        .page { 
            width: 1440px; height: 900px; 
            position: relative; 
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(230, 0, 18, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.04) 0%, transparent 50%);
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        .lf-component { position: absolute !important; box-sizing: border-box !important; transition: outline 0.1s; z-index: 500; }
        .lf-component:hover { outline: 2px solid var(--v4-accent) !important; cursor: move !important; }
        .lf-component.selected { outline: 2px solid var(--v4-accent) !important; z-index: 10001 !important; }
        
        .lf-drag-handle { position: absolute; top: -12px; left: -12px; width: 24px; height: 24px; background: var(--v4-accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .lf-component:hover .lf-drag-handle, .lf-component.selected .lf-drag-handle { opacity: 1; }
        
        .v4-card {
            background: #fff;
            border: 1px solid var(--v4-border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-img { height: 32px; width: auto; object-fit: contain; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--v4-text); letter-spacing: -0.5px; }
        .logo-sub { font-size: 14px; font-weight: 500; color: var(--v4-text-sub); margin-left: 4px; }

        .v4-editable-cell { outline: none; transition: background 0.2s; }
        .v4-editable-cell:focus { background: #f0f1f2; border-radius: 4px; }

        .cover-info-premium-table { width: 100%; border-collapse: collapse; font-size: 15px; background: #ffffff !important; }
        .cover-info-premium-table th { background: #f4f6f8; text-align: left; padding: 14px 24px; border-bottom: 2px solid #c0c4c9; color: #6d7175; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .cover-info-premium-table td { padding: 18px 24px; border-bottom: 1px solid #c0c4c9; background: #fff; line-height: 1.5; color: #1a1c1e !important; font-size: 16px; }
        .cover-info-premium-table tr:last-child td { border-bottom: none; }
        
        .accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: var(--v4-accent); }
        
        #cover-info-table, 
        #cover-info-table table,
        #cover-info-table td, 
        #cover-info-table th,
        #cover-info-table .v4-editable-cell {
            visibility: visible !important;
            opacity: 1 !important;
            color: #1a1c1e !important;
        }
    </style>
<style id="v4-inlined-style">
:root { --v4-primary: #6366f1; --v4-accent: #00e5ff; --v4-bg-dark: #0f172a; --v4-panel-bg: rgba(30, 41, 59, 0.7); --v4-border: rgba(255, 255, 255, 0.15); --v4-text-main: #ffffff; --v4-text-dim: #94a3b8; }
.lf-component { position: absolute; cursor: pointer; transition: outline 0.2s; box-sizing: border-box; z-index: 100; }
.lf-component.selected { outline: 2px solid #6366f1; z-index: 10001 !important; }
.lf-component .lf-component .lf-drag-handle, 
.lf-component .lf-component .lf-resizer, 
.lf-component .lf-component .lf-delete-trigger { display: none !important; }
.lf-drag-handle { position: absolute; top: -12px; left: -12px; width: 24px; height: 24px; background: #6366f1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; opacity: 0; transition: all 0.2s; border: 2px solid #fff; z-index: 10002; }
.lf-component:hover .lf-drag-handle, .lf-component.selected .lf-drag-handle { opacity: 1; top: -16px; left: -16px; }
.lf-resizer { position: absolute; bottom: -5px; right: -5px; width: 12px; height: 12px; background: #6366f1; cursor: nwse-resize; border-radius: 50%; border: 2px solid #fff; opacity: 0; transition: 0.2s; z-index: 10002; }
.lf-component:hover .lf-resizer, .lf-component.selected .lf-resizer { opacity: 1; }
.lf-delete-trigger { position: absolute; top: -12px; right: -12px; width: 24px; height: 24px; background: #ef4444; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; z-index: 10002; font-size: 14px; font-weight: bold; }
.lf-component:hover .lf-delete-trigger, .lf-component.selected .lf-delete-trigger { display: flex; }
.v4-premium-table { table-layout: fixed; border-collapse: collapse; overflow: hidden; border-radius: 8px; border: 1.6px solid #475569 !important; font-family: 'Inter', sans-serif; }
.v4-premium-table th { padding: 14px 16px; text-align: left; border-bottom: 1.6px solid #475569 !important; font-weight: 700; white-space: nowrap; }
.v4-premium-table td { padding: 14px 16px; border-bottom: 1.6px solid #cbd5e1 !important; }
.v4-premium-table tr:last-child td { border-bottom: none !important; }
.v4-shape { position: relative; border-width: 1.6px !important; border-style: solid !important; border-color: #475569; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #e2e8f0; color: #0f172a; }
.v4-editable-cell:focus { outline: 2px solid #6366f1; background: rgba(99, 102, 241, 0.05) !important; }
</style>
</head>
<body>
    <div class="page">
        <div class="accent-bar"></div>

        <div style="position: absolute; top: 60px; left: 80px;">
            <div class="logo-area">
                <img src="https://img.lfmall.co.kr/file/WAS/apps/2024/mfront/logo/lf_logo_mo.png" class="logo-img" alt="LF Logo">
                <div style="width: 1px; height: 24px; background: #ddd; margin: 0 4px;"></div>
                <div class="logo-text"><span class="logo-sub" style="margin-left: 0;">Project Management System</span></div>
            </div>
        </div>

        <div id="cover-title" class="lf-component" style="top: 220px; left: 80px; min-width: 800px;">
            <div contenteditable="true" class="v4-editable-cell" style="font-size: 54px; font-weight: 900; line-height: 1.15; letter-spacing: -2px; color: var(--v4-text); margin-bottom: 28px;">LFmall 배송 서비스 강화 (당일배송, 새벽배송)</div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div style="width: 40px; height: 3px; background: var(--v4-accent);"></div>
                <div contenteditable="true" class="v4-editable-cell" style="font-size: 24px; color: var(--v4-text-sub); font-weight: 500; letter-spacing: 1px; text-transform: uppercase;">TECHNICAL PLANNING SPECIFICATION</div>
            </div>
        </div>

        <div id="cover-version" class="lf-component" style="top: 500px; left: 80px;">
            <div style="display: flex; align-items: center; gap: 24px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 14px; font-weight: 800; color: var(--v4-text-sub);">DOCUMENT VERSION</span>
                    <div contenteditable="true" class="v4-editable-cell" style="font-size: 28px; font-weight: 800; color: var(--v4-accent);">v0.3</div>
                </div>
                <div style="width: 1px; height: 40px; background: var(--v4-border);"></div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 14px; font-weight: 800; color: var(--v4-text-sub);">JIRA IDENTIFIER</span>
                    <div id="cover-jira-id" contenteditable="true" class="v4-editable-cell" style="font-size: 28px; font-weight: 800; color: var(--v4-text);">LFML-p_arzgu</div>
                </div>
            </div>
        </div>

        <div id="cover-info-table" class="lf-component v4-card" style="bottom: 80px; right: 80px; width: 540px; padding: 0; overflow: hidden;">
            <table class="cover-info-premium-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">Information Entity</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-weight: 600; color: #6d7175;">Lead Designer / Author</td>
                        <td contenteditable="true" class="v4-editable-cell" style="font-weight: 700; color: #1a1c1e !important;">최범열</td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600; color: #6d7175;">Publication Date</td>
                        <td contenteditable="true" class="v4-editable-cell" style="font-weight: 700; color: #1a1c1e !important;">2026-05-18</td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600; color: #6d7175;">System Context</td>
                        <td contenteditable="true" class="v4-editable-cell" style="color: #1a1c1e !important;">LF E-commerce Platform</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body></html>
