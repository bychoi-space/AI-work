<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <title>05. 데이터 시뮬레이션</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --v4-primary: #1a1a1a;
            --v4-accent: #e60012;
            --v4-bg: #ffffff;
            --v4-surface: #f8f9fa;
            --v4-border: #e1e3e5;
            --v4-text: #1a1c1e;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--v4-surface); overflow: hidden; }
        .page { width: 1440px; height: 900px; position: relative; background: #ffffff; box-shadow: 0 40px 100px rgba(0,0,0,0.05); overflow: hidden; }
        
        .lf-component { position: absolute !important; box-sizing: border-box !important; }
        .lf-component:hover { outline: 2px solid var(--v4-accent) !important; cursor: move !important; }
        .lf-component.selected { outline: 2px solid var(--v4-accent) !important; z-index: 10001 !important; }
        
        .lf-drag-handle { position: absolute; top: -12px; left: -12px; width: 24px; height: 24px; background: var(--v4-accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .lf-component:hover .lf-drag-handle, .lf-component.selected .lf-drag-handle { opacity: 1; }
        
        .text-marker { 
            position: absolute; padding: 18px; border-radius: 12px; 
            border: 1.6px solid var(--v4-border); font-size: 14px; line-height: 1.6; 
            background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.04); box-sizing: border-box;
            color: #1e293b; text-align: left; transition: all 0.2s;
        }
        .text-marker:hover { border-color: var(--v4-accent); box-shadow: 0 12px 36px rgba(0,0,0,0.06); }
        .text-marker.selected { border-color: var(--v4-accent); outline: 2px solid var(--v4-accent); }
        .v4-editable-cell { outline: none; display: block; text-align: left; }
    </style>
<style id="v4-inlined-style">
.lf-component { position: absolute; cursor: pointer; transition: outline 0.2s; box-sizing: border-box; z-index: 100; }
.lf-component.selected { outline: 2px solid #6366f1; z-index: 10001 !important; }
.v4-editable-cell:focus { outline: 2px solid #6366f1; background: rgba(99, 102, 241, 0.05) !important; }
</style>
</head>
<body>
    <div class="page">
        <!-- Main PPT image slide -->
        <div class="lf-component" style="top: 137px; left: 30px; width: 1000px; height: 625px; pointer-events: none;">
            <img src="images/슬라이드6.JPG" style="width: 100%; height: 100%; object-fit: contain; display: block;" alt="Slide 6">
        </div>

        <!-- Editable description pin -->
        <div id="v4-pin-0" class="lf-component text-marker" style="top: 160px; left: 1050px; width: 340px;">
            <div class="v4-editable-cell" contenteditable="true">
                ⚙️ <strong>[시뮬레이션 전개]</strong><br>
                1. 주문 데이터 분석<br>
                2. 택배비 단가 상승 예측 모델링<br>
                Appendix를 통한 등급별 주문 분배 모델 적용 완료.
            </div>
        </div>
    </div>
</body></html>
